# Docker Compose Override for Local Development
# This file is automatically loaded by docker-compose
# It provides development-specific overrides

version: '3.9'

services:
  backend:
    # Development mode: use nodemon for hot reload
    command: npm run dev
    # Mount node_modules to avoid permission issues (optional)
    # volumes:
    #   - /app/node_modules

  frontend:
    # Development mode: Vite dev server with HMR
    # Use npm run dev to ensure proper module resolution
    command: npm run dev -- --host 0.0.0.0
    # Mount node_modules to avoid permission issues (optional)
    # volumes:
    #   - /app/node_modules

